name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format

      # 94 pre-existing errors on master, separate from the type backlog.
      # Reported but not blocking until they are triaged or ratcheted.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Compares per-file error counts against typecheck-baseline.json.
      # Fails on an increase, and on errors that stop tsc before it
      # checks anything.
      - name: Type-check
        run: npm run type-check:ratchet

      - name: Build
        run: npm run build:website
