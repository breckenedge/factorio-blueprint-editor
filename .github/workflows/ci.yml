name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format

      # Both checks compare per-file counts against a recorded baseline and
      # fail on an increase, since master carries a backlog in each. They also
      # fail outright when the checker did not actually inspect anything.
      - name: Lint
        run: npm run lint:ratchet

      - name: Type-check
        run: npm run type-check:ratchet

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:website
